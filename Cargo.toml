[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.60"
license = "MIT OR Apache-2.0"
categories = ["embedded", "hardware-support", "no-std"]
keywords = ["cw32", "pac", "register", "cortex-m", "cortex-m0plus"]

[profile.release]
opt-level = "s"
lto = false
